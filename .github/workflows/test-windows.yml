name: Windows Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/assets/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/assets/**'

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check source
        run: bun run check:ci
        env:
          CC_SAFETY_NET_E2E_ARTIFACTS: ${{ runner.temp }}/cc-safety-net-e2e
          # The pair lists behind every digest, uploaded with the failure evidence so a Windows
          # digest can be recorded from what the runner produced.
          CC_SAFETY_NET_DUMP_VERDICTS: ${{ runner.temp }}/cc-safety-net-e2e/digests
          # A short temp root, as the macOS leg pins: a `status` row renders a fixture path into a
          # fixed-width column, and the default user temp directory is too long for it.
          CC_SAFETY_NET_TEST_TMPDIR: ${{ runner.temp }}
      - run: bun run build
      - run: git diff --exit-code -- dist assets/cc-safety-net.schema.json THIRD_PARTY_LICENSES.txt
      - name: Verify Windows command behavior
        shell: pwsh
        run: |
          New-Item -ItemType Directory test-dir
          $result = bun run cc-safety-net explain --cwd test-dir "rm -rf dist" 2>&1
          if (-not ($result -match "ALLOWED")) { exit 1 }
      - name: Upload E2E failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-failure-evidence-windows
          path: ${{ runner.temp }}/cc-safety-net-e2e
          if-no-files-found: ignore
          retention-days: 7
